[package]
name = "sway-manager-daemon"
version = "0.1.0"
edition = "2024"
description = "Rust port of the SwayManager daemon core (IPC client/server, dispatch). GUI stays in PySide6."

[[bin]]
name = "sway-manager-daemon"
path = "src/main.rs"

[lib]
name = "sway_manager_daemon"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync", "process", "signal"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
