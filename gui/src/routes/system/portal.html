<!DOCTYPE html>
<!-- Portal SwayManager (slice D): seletor de compartilhamento p/ xdg-desktop-portal-wlr.
     Paridade: `src/presentation/gui/portal/dialog.py` + `source_card.py`:
     abas Telas/Janelas, cards selecionáveis, Enter/Espaço confirma, Esc cancela.
     Contrato stdout inviolável: este frontend NUNCA escreve o resultado em
     console/log — só devolve via `invoke('portal_select')`; o binário escreve
     a linha `output:<n>`/`window:<id>` na fase 2. `withGlobalTauri:true`. -->
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<style>
  :root, [data-theme="dark"] {
    --window-bg: #0D0B14;
    --sidebar-bg: #13111C;
    --card-bg: #191624;
    --card-border: rgba(157, 78, 221, 0.25);
    --text-primary: #F8F7FF;
    --text-secondary: #B8B3D0;
    --text-muted: #7A7596;
    --accent: #9D4EDD;
    --accent-hover: #C77DFF;
    --accent-text: #FFFFFF;
    --input-bg: #14121F;
    --input-border: rgba(157, 78, 221, 0.35);
    --button-bg: rgba(157, 78, 221, 0.12);
    --button-hover: rgba(157, 78, 221, 0.25);
    --button-border: rgba(199, 125, 255, 0.3);
    --selection-bg: #7B2CBF;
    --scrollbar: rgba(157, 78, 221, 0.4);
    --scrollbar-hover: rgba(199, 125, 255, 0.7);
  }
  [data-theme="light"] {
    --window-bg: #F5F5F7;
    --sidebar-bg: #E8E8ED;
    --card-bg: #FFFFFF;
    --card-border: rgba(0, 0, 0, 0.08);
    --text-primary: #000000;
    --text-secondary: #636366;
    --text-muted: #8E8E93;
    --accent: #007AFF;
    --accent-hover: #0062CC;
    --accent-text: #FFFFFF;
    --input-bg: #FFFFFF;
    --input-border: rgba(0, 0, 0, 0.15);
    --button-bg: rgba(0, 0, 0, 0.04);
    --button-hover: rgba(0, 0, 0, 0.08);
    --button-border: rgba(0, 0, 0, 0.1);
    --selection-bg: #007AFF;
    --scrollbar: rgba(0, 0, 0, 0.2);
    --scrollbar-hover: rgba(0, 0, 0, 0.35);
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--window-bg); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  /* Flex de altura total: a lista rola, as ações ficam sempre visíveis.
     Antes, 7+ janelas empurravam Compartilhar para fora da janela. */
  .root { padding: 24px 24px 20px; max-width: 720px; margin: 0 auto; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
  h1 { font-size: 22px; margin: 0 0 4px; flex-shrink: 0; }
  .desc { color: var(--text-secondary); margin: 0 0 16px; font-size: 13px; flex-shrink: 0; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-shrink: 0; }
  .tab {
    background: var(--card-bg); color: var(--text-secondary);
    border: 1px solid var(--card-border); border-radius: 8px;
    padding: 8px 24px; min-width: 80px; font-weight: bold; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .tab:hover { background: var(--button-hover); color: var(--text-primary); }
  .list { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; }
  .list::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  .list::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 10px; padding: 12px 16px; cursor: pointer; text-align: left;
    color: var(--text-primary); width: 100%;
  }
  .card small { display: block; color: var(--text-secondary); white-space: pre-line; }
  .card[aria-selected="true"] { background: var(--selection-bg); border: 2px solid var(--accent-hover); }
  .card:focus-visible, .tab:focus-visible, button:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
  .empty {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 24px; text-align: center; color: var(--text-secondary);
  }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-shrink: 0; }
  button.action {
    border-radius: 8px; padding: 8px 22px; min-width: 100px; font-weight: bold; cursor: pointer;
    background: var(--button-bg); color: var(--text-primary); border: 1px solid var(--button-border);
  }
  button.action:hover { background: var(--button-hover); border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.primary:disabled { background: var(--input-bg); color: var(--text-muted); border-color: var(--card-border); cursor: not-allowed; }
</style>
</head>
<body>
  <div class="root">
    <h1>Escolha o que deseja compartilhar</h1>
    <p class="desc">Selecione uma tela ou janela. Somente o conteúdo escolhido será compartilhado.</p>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-monitors" role="tab" aria-selected="true">Telas</button>
      <button class="tab" id="tab-windows" role="tab" aria-selected="false">Janelas</button>
    </div>
    <div class="list" id="sources" role="listbox" aria-label="Fontes compartilháveis"></div>
    <div class="actions">
      <button class="action" id="cancel">Cancelar</button>
      <button class="action primary" id="share" disabled>Compartilhar</button>
    </div>
  </div>
<script>
  // Estado espelha `PortalDialog`: abas Telas/Janelas, seleção explícita, Esc cancela.
  const state = { monitors: [], windows: [], reason: null, tab: 'monitor', selected: -1 };
  const list = document.getElementById('sources');
  const share = document.getElementById('share');

  function currentSources() {
    return state.tab === 'monitor' ? state.monitors : state.windows;
  }

  function emptyCopy() {
    if (state.tab === 'monitor') {
      return ['Nenhuma tela ativa encontrada', 'Verifique se há um output ativo no Sway e abra o seletor novamente.'];
    }
    if (state.reason) return ['Captura de janela indisponível', state.reason];
    return ['Nenhuma janela compartilhável encontrada', 'Abra uma janela compatível e inicie uma nova solicitação de compartilhamento.'];
  }

  function render() {
    document.getElementById('tab-monitors').setAttribute('aria-selected', String(state.tab === 'monitor'));
    document.getElementById('tab-windows').setAttribute('aria-selected', String(state.tab === 'window'));
    list.innerHTML = '';
    const sources = currentSources();
    if (sources.length === 0) {
      const [title, desc] = emptyCopy();
      const div = document.createElement('div');
      div.className = 'empty';
      const h = document.createElement('div');
      h.textContent = title;
      const p = document.createElement('div');
      p.textContent = desc;
      div.append(h, p);
      list.append(div);
    } else {
      sources.forEach((source, index) => {
        const card = document.createElement('button');
        card.className = 'card';
        card.setAttribute('role', 'option');
        card.setAttribute('aria-selected', String(index === state.selected));
        card.tabIndex = 0;
        const label = document.createElement('div');
        label.textContent = source.label;
        const details = document.createElement('small');
        details.textContent = source.details || source.id;
        card.append(label, details);
        card.addEventListener('click', () => select(index));
        card.addEventListener('dblclick', () => { select(index); confirm(); });
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(index); confirm(); }
          if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { event.preventDefault(); focusCard(index + 1); }
          if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { event.preventDefault(); focusCard(index - 1); }
        });
        list.append(card);
      });
    }
    share.disabled = state.selected < 0;
  }

  function select(index) {
    state.selected = index;
    render();
    const cards = list.querySelectorAll('.card');
    if (cards[index]) cards[index].focus();
  }

  function focusCard(index) {
    const sources = currentSources();
    if (sources.length === 0) return;
    const next = (index + sources.length) % sources.length;
    select(next);
  }

  function switchTab(tab) {
    state.tab = tab;
    state.selected = -1; // Qt limpa a seleção ao trocar de aba (`_on_tab_changed`).
    render();
  }

  async function confirm() {
    const sources = currentSources();
    const source = sources[state.selected];
    if (!source) return;
    await window.__TAURI__.core.invoke('portal_select', {
      resultJson: JSON.stringify({ sourceType: source.sourceType, id: source.id, rawLabel: source.rawLabel ?? null }),
    });
  }

  async function load(stdinText) {
    const payload = await window.__TAURI__.core.invoke('portal_sources', { stdinText: stdinText ?? null });
    state.monitors = payload.monitors ?? [];
    state.windows = payload.windows ?? [];
    state.reason = payload.windowReason ?? null;
    state.selected = -1;
    // Abre na aba com conteúdo: stdin dmenu de janela não tem monitores
    // (e vice-versa) — cair na aba vazia parecia "não funciona".
    state.tab = state.monitors.length > 0 ? 'monitor' : 'window';
    render();
  }

  document.getElementById('tab-monitors').addEventListener('click', () => switchTab('monitor'));
  document.getElementById('tab-windows').addEventListener('click', () => switchTab('window'));
  document.getElementById('cancel').addEventListener('click', cancel);
  share.addEventListener('click', confirm);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') cancel();
    if (event.key === 'Enter' || event.key === ' ') {
      const active = document.activeElement;
      if (active === document.body) { event.preventDefault(); confirm(); }
    }
    if (event.key === 'ArrowDown' || event.key === 'ArrowRight') { event.preventDefault(); focusCard(state.selected + 1); }
    if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') { event.preventDefault(); focusCard(state.selected - 1); }
  });

  render();
  load(new URLSearchParams(location.search).get('stdin'));
</script>
</body>
</html>
