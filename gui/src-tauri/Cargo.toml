[package]
name = "sway-manager-gui"
version = "0.1.0"
edition = "2024"
description = "SwayManager GUI (Tauri v2): thin WebviewWindows over sway-manager-daemon repos. Fase 1: comandos OSD."

[[bin]]
name = "SwayManagerGUI"
path = "src/main.rs"

[lib]
name = "sway_manager_gui"
path = "src/lib.rs"

[dependencies]
sway_manager_daemon = { package = "sway-manager-daemon", path = "../../daemon" }
glib = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["protocol-asset"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
